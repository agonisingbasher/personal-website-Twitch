    .page-lang button:hover,.page-lang button[aria-pressed="true"]{background:#7de5e4;color:#07131f}
    .page-lang button[aria-pressed="true"]{font-weight:800}
    .page-lang button:focus-visible{outline:2px solid #7de5e4;outline-offset:3px}
    @media(max-width:620px){.page-lang{gap:3px}.page-lang button{min-width:28px;padding:6px 4px}}

  <script>
    (function () {
      "use strict";
      const button = document.getElementById("copiar-chave");
      const code = document.getElementById("chave-pix");
      if (!button || !code) return;

      function text(key) {
        const language = window.pageTranslations[document.documentElement.lang] ? document.documentElement.lang : "pt-BR";
        return window.pageTranslations[language][key];
      }

      function copyWithTextarea(value) {
        const field = document.createElement("textarea");
        field.value = value;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.top = "-1000px";
        document.body.appendChild(field);
        field.select();
        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch (error) {
          copied = false;
        }
        field.remove();
        return copied;
      }

      let resetTimer = null;
      function markCopied() {
        button.textContent = text("suCopied");
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          button.textContent = text("suCopy");
        }, 2500);
      }

      button.addEventListener("click", () => {
        const value = button.dataset.chave || code.textContent.trim();
        const done = (copied) => {
          if (copied) {
            markCopied();
            return;
          }
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(code);
          selection.removeAllRanges();
          selection.addRange(range);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(() => done(true), () => done(copyWithTextarea(value)));
          return;
        }
        done(copyWithTextarea(value));
      });
    })();
  </script>
